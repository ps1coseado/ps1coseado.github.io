<style id="adaptive-layout">
/* ===== escala fluida según resolución / aspect ratio ===== */
:root{--pw:clamp(190px,15vw,300px);--pl:clamp(12px,3vw,110px);--gap:clamp(16px,2vw,40px)}
html{font-size:clamp(15px,calc(10px + .5vw),23px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:.8125rem}

/* ---- intro (letras bien puestas en cualquier pantalla) ---- */
#bg-start-audio{height:100vh;height:100dvh}
.hero-hud{padding:0}
.hud-top-left,.hud-top-right{top:max(1rem,calc(env(safe-area-inset-top,0px) + .6rem));white-space:nowrap;font-size:clamp(.56rem,1.4vw + .3rem,.8rem);letter-spacing:clamp(.04em,.6vw,.14em)}
.hud-top-left{left:clamp(1rem,3vw,2.2rem)}
.hud-top-right{right:clamp(1rem,3vw,2.2rem)}

.hud-br{right:clamp(1rem,3vw,2.2rem);bottom:max(1rem,env(safe-area-inset-bottom,0px))}
.hero-click-prompt{white-space:nowrap;max-width:96vw;text-align:center;font-size:clamp(.62rem,2.2vw + .2rem,.95rem);letter-spacing:clamp(.12em,1.2vw,.35em);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(1.4rem,5.5vh,3.5rem))}
.hero-typeline{white-space:nowrap;max-width:94vw;overflow:hidden;font-size:clamp(.55rem,1.8vw + .1rem,.82rem);letter-spacing:clamp(.08em,.9vw,.3em);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(3.6rem,12vh,6.5rem))}
@media (max-width:700px){
  .hud-top-right{right:auto;left:calc(clamp(1rem,3vw,2.2rem) + 14px);top:calc(max(1rem,env(safe-area-inset-top,0px) + .6rem) + 1.7em)}
}

/* ---- layout principal fluido ---- */
.app-container{width:100%;min-height:100vh;min-height:100dvh}
.left-panel{width:var(--pw);left:var(--pl);max-height:calc(100vh - 2rem)}
.main-content{margin-left:calc(var(--pw) + var(--pl) + var(--gap));padding:clamp(1rem,2.2vw,3rem)}
.section{max-width:62.5rem;padding:clamp(1.25rem,2.2vw,2.5rem)}
#profileBio{margin-bottom:clamp(2rem,8vh,6rem)!important}
.staff-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.foot{max-width:28rem}

/* ---- avatar / nombre / links ---- */
.profile-wrapper,.profile-border{width:10.5rem;height:10.5rem}
.profile-image{width:9.875rem;height:9.875rem}
.discord-status-dot{width:1.5rem;height:1.5rem;bottom:.4rem;right:.4rem}
.subtitle{flex-wrap:wrap;justify-content:center;font-size:clamp(1rem,4.2vw,1.3rem)}
.subtitle svg{width:1.15em;height:1.15em}
.bio-links-grid .bio-link{font-size:clamp(.9rem,3.6vw,1rem)}

/* ---- anillo de logos ---- */
.logo-ring{--R:clamp(92px,8vw + 40px,170px);--sz:clamp(44px,3vw + 28px,70px);height:calc(var(--R) * .83 + 34px)}
.logo-ring::after{width:calc(var(--R) * 2)}

/* ---- tablets / móviles / vertical ---- */
@media (max-width:900px){
  .app-container{flex-direction:column}
  .left-panel{width:100%;left:0;max-height:none}
  .main-content{margin-left:0;padding:1rem}
  .staff-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
}
@media (max-width:560px){
  .section{padding:1.25rem 1rem}
  .profile-wrapper,.profile-border{width:9.5rem;height:9.5rem}
  .profile-image{width:8.9rem;height:8.9rem}

/* ---- móvil horizontal / pantallas bajas ---- */
@media (max-height:520px){
  html{font-size:14px}
  .profile-wrapper,.profile-border{width:8rem;height:8rem}
  .profile-image{width:7.5rem;height:7.5rem}

  .hero-typeline{bottom:2.6rem}

  .panel-item{padding-top:.5rem;padding-bottom:.5rem}

  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24);
  return d < 30 ? `${d}d` : new Date(Number(ts)).toLocaleDateString();
}

function elapsed(ts) {
  if (!ts) return "";
  const m = Math.floor(Math.max(0, Date.now() + state.clockOffset - Number(ts)) / 60000);
  if (m < 1) return "<1m";
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60}m` : `${Math.floor(h / 24)}d`;
}

function hue(seed) {
  let h = 0;
  for (const ch of String(seed || "")) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

function gradient(seed) {
  const shade = 8 + (hue(seed) % 18);
  return `linear-gradient(140deg, hsl(0 0% ${shade + 12}%), hsl(0 0% ${shade}%))`;
}

function hexToRgba(hex, alpha) {
  let c = String(hex || "").replace("#", "");
  if (c.length === 3) c = c.split("").map((x) => x + x).join("");
  const bigint = parseInt(c, 16) || 0;
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyAvatarDecoration(asset) {
  const img = $("avatarDecoration");
  if (!img) return;
  if (!asset) {
    img.hidden = true;
    img.removeAttribute("src");
    delete img.dataset.asset;
    return;
  }
  if (img.dataset.asset === asset) {
    img.hidden = false;
    return;
  }
  img.dataset.asset = asset;
  img.hidden = false;
  img.onerror = () => { img.hidden = true; img.onerror = null; };
  img.src = `${DISCORD_CDN}/avatar-decoration-presets/${encodeURIComponent(asset)}.png`;
}

function bannerCdnUrl(value) {
  try {
    const url = new URL(value);
    if (/(^|\.)discordapp\.com$/i.test(url.hostname) && !url.searchParams.has("size")) {
      url.searchParams.set("size", "1024");
    }
    return url.toString();
  } catch (err) {
    return value;
  }
}

function applyDiscordBanner(profile) {
  const wrap = $("profileBanner");
  const img = $("profileBannerImg");
  if (!wrap || !img || !profile) return;
  const url = typeof profile.bannerURL === "string" ? bannerCdnUrl(profile.bannerURL) : "";
  const color = typeof profile.banner_color === "string" ? profile.banner_color : "#0b0b0d";
  wrap.style.setProperty("--profile-banner-color", color);
  if (!url) {
    wrap.classList.remove("is-loaded");
    img.removeAttribute("src");
    delete img.dataset.url;
    return;
  }
  if (img.dataset.url === url) return;
  img.dataset.url = url;
  wrap.classList.remove("is-loaded");
  img.onload = () => wrap.classList.add("is-loaded");
  img.onerror = () => { wrap.classList.remove("is-loaded"); img.onerror = null; };
  img.src = url;
}

let lastDiscordProfileSync = 0;

async function syncDiscordProfile(force) {
  const id = window.__CONFIG__ && window.__CONFIG__.discord_id;
  if (!id) return;
  if (!force && Date.now() - lastDiscordProfileSync < 60 * 1000) return;
  lastDiscordProfileSync = Date.now();
  try {
    const r = await fetch(`https://japi.rest/discord/v1/user/${id}`, { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const profile = j && j.data;
    if (!profile) return;
    applyDiscordBanner(profile);
    const decoration = profile.avatar_decoration_data && profile.avatar_decoration_data.asset;
    if (decoration) applyAvatarDecoration(decoration);
  } catch (err) {
    // keep the last known banner and decoration when the public API is unavailable
  }
}

function renderProfile(data) {
  const user = data.discord?.user || {};
  const status = data.discord?.status || "offline";
  // the ticket pins the displayed name — Discord's display_name is ignored here
  const name = "psicoseado";

  const nameEl = $("profileName");
  if (state.profileName !== name) {
    state.profileName = name;

    // span blanks its glyph paint in Chrome
    const ghost = `<span class="name-ghost" aria-hidden="true">${esc(name)}</span>`;

/* ------------------------------------------------------------------- rows */
function iconHtml(art, seed, opts = {}) {
  if (opts.dot) {
    return `<span class="row-icon dot" data-status="${esc(opts.status || "offline")}"></span>`;
  }
  if (art) {
    return `<img class="row-icon" src="${esc(art)}" alt="" loading="lazy" style="background:${gradient(seed)}" onerror="this.removeAttribute('src')" />`;
  }
  return `<span class="row-icon ph" style="background:${gradient(seed)}">${esc((seed || "?").slice(0, 1).toUpperCase())}</span>`;
}

function rowHtml({ art, seed, dot, status, title, sub, right, rightHtml, rightLive, href }) {
  const url = safeUrl(href);
  const tail = rightHtml !== undefined
    ? rightHtml
    : right
      ? `<span class="row-right${rightLive ? " live" : ""}">${esc(right)}</span>`
      : "";
  return `
    <div class="row${url ? " is-link" : ""}"${url ? ` data-href="${esc(url)}"` : ""}>
      ${iconHtml(art, seed || title, { dot, status })}
      <div class="row-body">
        <div class="row-title">${esc(title)}</div>
        ${sub ? `<div class="row-sub">${esc(sub)}</div>` : ""}
      </div>
      ${tail}
    </div>`;
}

function bindLinks(root) {
  root.querySelectorAll(".row[data-href]").forEach((row) => {
    row.addEventListener("click", () => window.open(row.dataset.href, "_blank", "noopener"));
  });
}

/* ------------------------------------------------------------- presence box */
function renderPresenceBox(data) {
  const root = $("presence");
  if (!root) return;
  const discord = data.discord || {};
  const media = data.media || {};
  const activities = (discord.activities || []).slice(0, 4);
  const custom = discord.custom_status;
  const rows = [];

  if (discord.ok) {
    const platforms = discord.platforms || {};
    const client = platforms.desktop ? "desktop" : platforms.web ? "web" : platforms.mobile ? "mobile" : "";
    rows.push(rowHtml({
      dot: true,
      status: discord.status,
      title: STATUS_LABEL[discord.status] || "Online",
      sub: custom && custom.text ? custom.text : "no custom status",
      right: client,
    }));
  }

  for (const act of activities) {
    rows.push(rowHtml({
      art: act.image,
      seed: act.name,
      title: act.name,
      sub: [act.details, act.state].filter(Boolean).join(" — ") || act.kind,
      right: act.started_at ? elapsed(act.started_at) : act.kind,
    }));
  }

  if (!rows.length) {
    if (media.ok && media.title) {
      rows.push(rowHtml({
        art: media.art,
        seed: media.title,
        title: media.app || "media",
        sub: `${media.title}${media.artist ? ` — ${media.artist}` : ""}`,
        right: media.status,
        rightLive: media.status === "playing",
      }));
    } else if (discord.last_activity?.name) {
      const last = discord.last_activity;
      rows.push(rowHtml({
        dot: true,
        status: "offline",
        title: last.name,
        sub: last.details || "last activity",
        right: ago(last.at),
      }));
    } else {
      rows.push(`<div class="empty-row">nothing running right now</div>`);
    }
  }

  root.innerHTML = rows.join("");
  bindLinks(root);
}

/* ------------------------------------------------------------- now playing */
function currentTrack(data) {
  const np = data.spotify?.now_playing;
  if (np) return np;

  const rp = data.discord?.spotify;
  if (!rp) return null;
  const duration = rp.ends_at && rp.started_at ? rp.ends_at - rp.started_at : 0;
  return {
    name: rp.track,
    artist: rp.artist,
    album: rp.album,
    art: rp.art,
    duration_ms: duration,
    progress_ms: rp.started_at ? Math.min(duration, Date.now() + state.clockOffset - rp.started_at) : 0,
    is_playing: duration ? rp.ends_at > Date.now() + state.clockOffset : true,
    url: rp.url,
    app: "spotify",
  };
}

function renderNow(data) {
  const root = $("now");
  if (!root) return;
  const track = currentTrack(data);

  if (!track) {
    const media = data.media || {};
    root.innerHTML = `<div class="empty-row">${media.available === false
      ? "media bridge offline"
      : "nothing playing — hit play anywhere"}</div>`;
    state.playing = null;
    return;
  }

  const live = !!track.is_playing;
  const sub = [track.artist, track.album].filter(Boolean).join(" — ") || track.app || "";
  const rightHtml = live
    ? '<span class="row-right live"><span class="eq"><i></i><i></i><i></i><i></i></span></span>'
    : '<span class="row-right">paused</span>';

  root.innerHTML = `
    ${rowHtml({
      art: track.art,
      seed: `${track.name}${track.artist || ""}`,
      title: track.name,
      sub,
      rightHtml,
      href: track.url,
    })}
    ${live && track.duration_ms ? `
      <div class="track-progress"><span id="np-fill"></span></div>
      <div class="track-times"><span id="np-elapsed">0:00</span><span id="np-total">${mmss(track.duration_ms)}</span></div>` : ""}
  `;

  bindLinks(root);

  if (live && track.duration_ms) {
    state.playing = {
      base: Number(track.progress_ms) || 0,
      at: Date.now(),
      duration: Number(track.duration_ms),
    };
    paintProgress();
  } else {
    state.playing = null;
  }
}

function paintProgress() {
  const np = state.playing;
  if (!np || !np.duration) return;
  const fill = $("np-fill");
  const label = $("np-elapsed");
  if (!fill || !label) return;
  const played = Math.min(np.duration, np.base + (Date.now() - np.at));
  fill.style.width = `${((played / np.duration) * 100).toFixed(2)}%`;
  label.textContent = mmss(played);
}

function renderRecent(data) {
  const root = $("recent");
  if (!root) return;
  const sp = data.spotify || {};
  const items = (sp.history || []).slice(0, 3);
  const liveId = currentTrack(data)?.id;

  if (!items.length) {
    root.innerHTML = `<div class="empty-row">no plays recorded yet</div>`;
    return;
  }

  root.innerHTML = items.map((track) => {
    const isLive = liveId && track.id === liveId;
    return rowHtml({
      art: track.art,
      seed: `${track.name}${track.artist || ""}`,
      title: track.name,
      sub: track.artist || "",
      right: isLive ? "now" : track.played_at ? ago(track.played_at) : "",
      rightLive: !!isLive,
      href: track.url,
    });
  }).join("");

  bindLinks(root);
}

/* ------------------------------------------------------- staff experience */
/**
 * Role chips read as colour-coded seniority, mirroring the reference regexes:
 * white owns the process, silver runs the server, gray moderates and assists,
 * light gray holds verification. Order matters — "SS MANAGER" hits white first.
 */
function roleColor(label) {
  const text = String(label || "").toUpperCase();
  if (/OWNER/.test(text)) return "#ffffff";
  if (/MANAGER/.test(text)) return "#ffffff";
  if (/COORDINATOR|LEAD/.test(text)) return "#dcdcdc";
  if (/ADMIN/.test(text)) return "#cfcfcf";
  if (/MOD/.test(text)) return "#a8a8a8";
  if (/HELPER|TRIAL/.test(text)) return "#8a8a8a";
  if (/\bSS\b/.test(text)) return "#c0c0c0";
  return "#9a9a9a";
}

/* Higher-charge roles are listed first: SS Manager > Coordinator > SS Verify > Admin > Mod > Helper. */
function roleRank(label) {
  const text = String(label || "").toUpperCase();
  if (/OWNER/.test(text)) return 100;
  if (/SS\s*MANAGER/.test(text)) return 95;
  if (/MANAGER/.test(text)) return 90;
  if (/SS\s*COORDINATOR/.test(text)) return 85;
  if (/COORDINATOR|LEAD/.test(text)) return 80;
  if (/SS\s*VERIFY/.test(text)) return 75;
  if (/ADMIN/.test(text)) return 70;
  if (/MOD/.test(text)) return 60;
  if (/HELPER|TRIAL/.test(text)) return 50;
  if (/VERIF/.test(text)) return 45;
  return 0;
}

function entryRank(entry) {
  return String((entry && entry.role) || "")
    .split("\u00b7")
    .map((part) => roleRank(part.trim()))
    .reduce((max, n) => Math.max(max, n), 0);
}

function roleChip(label) {
  const color = roleColor(label);
  return `<span class="server-role" style="background:${hexToRgba(color, 0.12)};border-color:${hexToRgba(color, 0.25)};color:${color};">${esc(label)}</span>`;
}

function chipIcons(entry) {
  const chips = String(entry.role || "").split("·").map((p) => p.trim()).filter(Boolean);
  return { chips, count: chips.length };
}

function cardMatches(entry, query, filter) {
  const haystack = `${entry.name || ""} ${entry.role || ""}`.toLowerCase();
  if (query && !haystack.includes(query)) return false;
  if (filter === "lead") return /MANAGER|COORDINATOR|ADMIN|OWNER|LEAD/i.test(entry.role || "");
  if (filter === "ss") return /\bSS\b/i.test(entry.role || "");
  return true;
}

function renderStaff(staff) {
  const host = $("staffCategories");
  const entries = ((staff && Array.isArray(staff.items)) ? staff.items : [])
    .filter((entry) => entry && entry.name)
    .slice()
    .sort((a, b) => entryRank(b) - entryRank(a));

  if (!entries.length) {
    host.innerHTML = `<div class="empty-row">no experience configured yet</div>`;
    return;
  }

  const icon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4z"/><path d="M9 8V5h6v3"/><path d="M4 13h16"/></svg>';
  const title = (staff && staff.categoryTitle) || "Servers";

  host.innerHTML = `
    <div class="staff-category" data-category="servers">
      <h3>${icon} ${esc(title)}</h3>
      <div class="staff-grid">
        ${entries.map((entry, index) => {
          const { chips } = chipIcons(entry);
          const logo = typeof entry.image === "string" && (entry.image.startsWith("/") || /^data:image\/(webp|png|jpe?g);base64,/i.test(entry.image))
            ? entry.image
            : (safeUrl(entry.image) || "");
          return `
            <div class="server-card"
                 data-server="${esc(entry.name)}"
                 data-roles="${esc(entry.role || "")}"
                 data-index="${index}"
                 style="--i:${index}">
              ${logo ? `<img class="card-logo" src="${esc(logo)}" alt="${esc(entry.name)} icon" loading="lazy" decoding="async" draggable="false">` : ""}
              <div class="server-info">
                <h4>${esc(entry.name)}</h4>
                ${entry.year ? `<div class="server-year">${esc(entry.year)}</div>` : ""}
                <div class="server-roles-wrap">${chips.map(roleChip).join("")}</div>
              </div>
            </div>`;
        }).join("")}
      </div>
    </div>`;

  bindStaffFeatures(entries);
  buildRing(entries);
  updateStats(entries, staff);
  applyStaffFilter();
  observeReveals();
}

function bindStaffFeatures(entries) {
  const searchInput = $("serverSearchInput");
  const clearBtn = $("clearSearchBtn");

  searchInput.addEventListener("input", () => {
    clearBtn.style.display = searchInput.value ? "block" : "none";
    applyStaffFilter();
  });
  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    clearBtn.style.display = "none";
    applyStaffFilter();
    searchInput.focus();
  });

}

function applyStaffFilter() {
  const query = ($("serverSearchInput").value || "").trim().toLowerCase();
  const cards = document.querySelectorAll(".server-card");
  const groups = document.querySelectorAll(".staff-category");
  let visible = 0;

  cards.forEach((card) => {
    const entry = {
      name: card.dataset.server,
      role: card.dataset.roles,
    };
    const show = cardMatches(entry, query, state.filter);
    const wasHidden = card.style.display === "none";
    card.style.display = show ? "" : "none";
    if (show && wasHidden && state.revealed) card.style.animation = "none";
    if (show) visible += 1;
  });

  groups.forEach((group) => {
    const any = Array.from(group.querySelectorAll(".server-card")).some(
      (card) => card.style.display !== "none"
    );
    group.style.display = any ? "" : "none";
  });

  $("noResultsMsg").style.display = visible ? "none" : "block";
}

function animateValue(id, start, end, duration, suffix) {
  const el = $(id);
  if (!el) return;
  const t0 = performance.now();
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / duration);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = `${Math.round(start + (end - start) * eased)}${suffix || ""}`;
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function updateStats(entries, staff) {
  const roles = entries.reduce((sum, entry) => {
    const parts = String(entry.role || "").split("·").filter((p) => p.trim());
    return sum + Math.max(1, parts.length);
  }, 0);
  const overrides = (staff && staff.stats) || {};

  animateValue("statTotalServers", 0, entries.length, 1200, "");
  animateValue("statTotalRoles", 0, overrides.roles != null ? overrides.roles : roles, 1400, "");
  const years = overrides.yearsActive != null ? String(overrides.yearsActive) : "1+";
  if (/^\d+$/.test(years)) animateValue("statYearsActive", 0, Number(years), 1000, "+");
  else $("statYearsActive").textContent = years;
}

/* -------------------------------------------------------------- bio/links */
function renderBio(profile) {

/* --------------------------------------------------------------- panel nav */
function bindPanel() {
  const items = Array.from(document.querySelectorAll(".panel-item"));
  const sections = Array.from(document.querySelectorAll(".section"));
  if (!items.length || !sections.length) return;

  const find = (id) => sections.find((s) => s.id === id);

  items.forEach((item) => {
    item.addEventListener("click", () => {
      const node = find(item.dataset.section);
      if (node) node.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  let queued = false;
  const paint = () => {
    queued = false;
    const middle = window.scrollY + window.innerHeight / 2;
    let active = items[0];
    let best = Infinity;
    for (const section of sections) {
      const center = section.offsetTop + section.offsetHeight / 2;
      const distance = Math.abs(middle - center);
      if (distance < best) {
        best = distance;
        const match = items.find((i) => i.dataset.section === section.id);
        if (match) active = match;
      }
    }
    items.forEach((item) => item.classList.toggle("active", item === active));
    document.body.dataset.part = active.dataset.section === "staffExperience" ? "two" : "one";
  };

  const onScroll = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(paint);

    const doc = document.documentElement;
    const max = doc.scrollHeight - window.innerHeight;
    const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    document.querySelector(".scroll-progress-bar").style.width = `${pct.toFixed(2)}%`;
  };

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  if (document.fonts?.ready) document.fonts.ready.then(onScroll).catch(() => {});
  paint();
}

/* ------------------------------------------------------------------- intro */
function revealApp(x, y) {
  if (state.revealed) return;
  state.revealed = true;

  const overlay = $("bg-start-audio");
  const app = document.querySelector(".app-container");
  const ox = Number.isFinite(x) ? x : window.innerWidth / 2;
  const oy = Number.isFinite(y) ? y : window.innerHeight / 2;

  // must run inside the user gesture so the browser unlocks audio
  startMusic();

  if (overlay) {
    overlay.style.setProperty("--ox", ox + "px");
    overlay.style.setProperty("--oy", oy + "px");
    const burst = overlay.querySelector(".intro-burst");
    if (burst) {
      burst.style.left = ox + "px";
      burst.style.top = oy + "px";
    }
    overlay.classList.add("is-leaving");
    overlay.style.pointerEvents = "none";
    setTimeout(() => overlay.remove(), 1150);
  }

  document.body.classList.add("app-active");
  document.documentElement.classList.add("custom-cursor");
  document.body.style.overflowY = "auto";

  if (app) {
    app.style.opacity = "1";
    app.classList.add("animate-in");
  }

  const vol = $("volume-control");
  if (vol) vol.classList.add("animate-in");

  document.querySelectorAll(".section").forEach((s) => {
    s.style.opacity = "1";
    s.classList.add("visible");

  setTimeout(() => buildRing(state.ringEntries), 900);
  bindNameReplay();
}

/* One track only, streamed from a local file and looped forever. */
const TRACKS = [
  { name: "Rauw Alejandro ft. Tainy \u2014 Pens\u00e1ndote", src: "./pensandote.mp3" },
];
const music = { i: 0, started: false };

function trackUrl(k) {
  return TRACKS[k] ? TRACKS[k].src : "";
}

function playTrack(k) {
  const audio = $("bg-music");
  if (!audio) return;
  music.i = k;
  const url = trackUrl(k);
  if (!url) return;
  audio.src = url;
  const credit = $("song-credit");
  if (credit) credit.textContent = "\u266a " + TRACKS[k].name;
  const p = audio.play();
  if (p && p.catch) p.catch(() => {
    // autoplay blocked: retry on the next interaction
    const retry = () => { audio.play().catch(() => {}); };
    window.addEventListener("pointerdown", retry, { once: true });
    window.addEventListener("keydown", retry, { once: true });
  });
}

function startMusic() {
  const audio = $("bg-music");
  if (!audio || music.started) return;
  music.started = true;
  audio.loop = true;
  audio.volume = state.musicVolume;
  playTrack(0);
}

/* -------------------------------------------------------------- name replay */
/* Re-runs the whole blur stack: hover or click the name to replay the pop, and
   it self-replays every 9s while visible so the effect is never missed. */
function replayName() {
  const h1 = $("profileName");
  if (!h1) return;
  const parts = h1.querySelectorAll(".name-letter, .name-ghost, .name-echo");
  if (!parts.length) return;
  parts.forEach((el) => { el.style.animation = "none"; });
  void h1.offsetWidth; // force a style flush so the animation restarts
  parts.forEach((el) => { el.style.animation = ""; });
}

function bindNameReplay() {
  const h1 = $("profileName");
  if (!h1 || h1.dataset.replayBound === "1") return;
  h1.dataset.replayBound = "1";
  h1.addEventListener("mouseenter", replayName);
  h1.addEventListener("click", replayName);
  if (state.nameReplayTimer) clearInterval(state.nameReplayTimer);
  state.nameReplayTimer = setInterval(() => {
    if (!state.revealed || document.hidden) return;
    const rect = h1.getBoundingClientRect();
    if (rect.bottom < 0 || rect.top > window.innerHeight) return;
    replayName();
  }, 9000);
}

function bindIntro() {
  document.body.style.overflowY = "hidden";
  const overlay = $("bg-start-audio");
  if (!overlay) {
    revealApp();
    return;
  }

  let done = false;
  const fire = (ev) => {
    if (done) return;
    const key = ev && ev.type === "keydown" ? ev.key : null;
    if (key && key !== "Enter" && key !== " " && key !== "Spacebar") return;
    done = true;
    window.removeEventListener("pointerdown", fire, true);
    window.removeEventListener("touchstart", fire, true);
    window.removeEventListener("keydown", fire, true);

    if (key) {
      ev.preventDefault();
      revealApp();
    } else {
      revealApp(ev.clientX, ev.clientY);
    }
  };

  window.addEventListener("pointerdown", fire, { capture: true });
  window.addEventListener("touchstart", fire, { capture: true, passive: true });
  window.addEventListener("keydown", fire, { capture: true });
}

/* -------------------------------------------------------------- typewriter */
function startTypewriter(phrases) {
  const el = $("typewriter");
  if (!el) return;
  const lines = (Array.isArray(phrases) ? phrases : [])
    .map((p) => String(p || "").trim())
    .filter(Boolean);
  if (!lines.length) return;

  let idx = 0;
  let pos = 0;
  let deleting = false;
  let timer = null;

  const step = () => {
    const text = lines[idx];
    pos += deleting ? -1 : 1;
    el.textContent = text.slice(0, pos);

    let delay = deleting ? 28 : 52;
    if (!deleting && pos === text.length) {
      delay = 2100;                       // hold the full line before deleting
      deleting = true;
    } else if (deleting && pos === 0) {
      deleting = false;
      idx = (idx + 1) % lines.length;
      delay = 500;                        // breath before the next line
    }
    timer = setTimeout(step, delay);
  };
  timer = setTimeout(step, 1750);
}

/* ------------------------------------------------------------------ volume */
function bindVolume() {
  const bgMusic = $("bg-music");
  const slider = $("volume-slider");
  const iconWrap = $("volume-icon-wrap");
  if (!bgMusic || !slider || !iconWrap) return;

  const icon = $("volume-icon");
  const setIcon = (v) => {
    icon.style.opacity = v > 0 ? "1" : "0.45";
    icon.querySelectorAll(".wave").forEach((w, i) => {
      w.style.display = v > (i === 0 ? 0.01 : 0.55) ? "" : "none";
    });
  };

  let lastVolume = state.musicVolume;
  slider.value = String(state.musicVolume);
  setIcon(state.musicVolume);

  slider.addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    bgMusic.volume = v;
    if (v > 0) lastVolume = v;
    setIcon(v);
  });

  iconWrap.addEventListener("click", () => {
    if (bgMusic.volume > 0) {
      lastVolume = bgMusic.volume;
      bgMusic.volume = 0;
      slider.value = "0";
    } else {
      bgMusic.volume = lastVolume || state.musicVolume;
      slider.value = String(bgMusic.volume);
    }
    setIcon(bgMusic.volume);
  });
}

/* ------------------------------------------------------------ intro stage */
state.musicVolume = 0.075;

function initIntroStage(displayText) {
  const mark = $("introWordmark");
  const overlay = $("bg-start-audio");
  if (!mark) return;

  const text = String(displayText || "PSICOSEADO").toUpperCase().trim() || "PSICOSEADO";
  if (mark.dataset.text !== text) {
    mark.dataset.text = text;
    mark.setAttribute("aria-label", text);

    const word = $("introWord");
    const shine = $("introShine");
    const glare = $("introGlare");
    if (word) word.textContent = text;
    if (shine) shine.textContent = text;
    if (glare) glare.textContent = text;
    mark.querySelectorAll(".intro-echo").forEach((echo) => { echo.textContent = text; });

    const slices = $("introSlices");
    if (slices) {
      const depth = window.matchMedia("(pointer: coarse)").matches ? 24 : 30;
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= depth; i++) {
        const slice = document.createElement("span");
        slice.className = "intro-slice";
        slice.textContent = text;
        slice.style.setProperty("--d", i);
        const shade = Math.round(158 - (i / depth) * 108);
        slice.style.setProperty("--side", `rgb(${shade},${shade},${shade + 8})`);
        slice.style.setProperty("--delay", (30 + (depth - i) * 8) + "ms");
        frag.appendChild(slice);
      }
      slices.replaceChildren(frag);
    }
  }

  if (!overlay || overlay.dataset.stageBound === "1") return;
  overlay.dataset.stageBound = "1";

  let targetX = 0;
  let targetY = 0;
  let currentX = 0;
  let currentY = 0;
  let raf = 0;
  const start = performance.now();

  const apply = (now) => {
    if (!overlay.isConnected) return;
    raf = requestAnimationFrame(apply);

    const t = now - start;
    currentX += (targetX - currentX) * 0.065;
    currentY += (targetY - currentY) * 0.065;

    // slow autonomous orbit keeps the object dimensional on touch devices
    const swayY = Math.sin(t * 0.00038) * 5;
    const swayX = Math.cos(t * 0.00031) * 2.4;
    const lift = Math.sin(t * 0.0007) * 6;

    mark.style.setProperty("--ry", (-12 + currentX * 14 + swayY).toFixed(2) + "deg");
    mark.style.setProperty("--rx", (6 - currentY * 10 + swayX).toFixed(2) + "deg");
    mark.style.setProperty("--lift", lift.toFixed(2) + "px");
    mark.style.setProperty("--lx", (54 + currentX * 24 + swayY * 2.2).toFixed(2) + "%");
    mark.style.setProperty("--ly", (26 - currentY * 16 + swayX * 2).toFixed(2) + "%");
    mark.style.setProperty("--bx", (-currentX * 14).toFixed(2) + "%");
    overlay.style.setProperty("--gx", ((currentX * 0.5 + 0.5) * 100).toFixed(2) + "%");
    overlay.style.setProperty("--gy", ((currentY * 0.5 + 0.5) * 100).toFixed(2) + "%");
  };
  raf = requestAnimationFrame(apply);

  overlay.addEventListener("pointermove", (e) => {
    targetX = (e.clientX / window.innerWidth) * 2 - 1;
    targetY = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  overlay.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
  });
}

/* -------------------------------------------------------------- ghost trail */
function ghostCursor(options) {
  const maxAge = (options && options.lifeSpan) || 500;   // ms a spark lives
  let width = window.innerWidth;
  let height = window.innerHeight;
  const cursor = { x: width / 2, y: height / 2 };
  let prev = { x: cursor.x, y: cursor.y };
  let cursorVX = 0;
  let cursorVY = 0;
  let lastMove = 0;
  let lastFrame = 0;
  let particles = [];
  let canvas, context;

  // Full motion is forced on this portfolio; the cursor trail always runs on fine pointers.

  class Spark {
    constructor(x, y, vx, vy, born) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.born = born;
      this.size = 2.2 + Math.random() * 2.6;
      this.dead = false;
      this.t = 0;
    }

    update(now, dtMs) {
      const age = now - this.born;
      if (age > maxAge) {
        this.dead = true;
        return;
      }
      const t = age / maxAge;
      // keep gliding with damping — the smear keeps travelling after the cursor
      this.x += this.vx * dtMs;
      this.y += this.vy * dtMs;
      this.vx *= 0.9;
      this.vy *= 0.9;
      this.t = t;
    }

    draw(ctx) {
      const fade = Math.pow(1 - this.t, 1.6);
      const speed = Math.hypot(this.vx, this.vy);
      // motion blur: streak stretches along the velocity vector with speed
      const streak = Math.min(46, 6 + speed * 46);
      const nx = speed > 0.0001 ? this.vx / speed : 0;
      const ny = speed > 0.0001 ? this.vy / speed : 1;
      const tx = this.x - nx * streak;
      const ty = this.y - ny * streak;

      const grad = ctx.createLinearGradient(tx, ty, this.x, this.y);
      grad.addColorStop(0, "rgba(255, 255, 255, 0)");
      grad.addColorStop(0.45, `rgba(255, 255, 255, ${(0.5 * fade).toFixed(3)})`);
      grad.addColorStop(1, `rgba(255, 255, 255, ${(0.9 * fade).toFixed(3)})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = this.size * (0.4 + 0.6 * (1 - this.t));
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();

      // hot head glow
      const head = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3.2);
      head.addColorStop(0, `rgba(255, 255, 255, ${(0.85 * fade).toFixed(3)})`);
      head.addColorStop(0.4, `rgba(255, 255, 255, ${(0.45 * fade).toFixed(3)})`);
      head.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = head;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function init() {
    canvas = document.createElement("canvas");
    context = canvas.getContext("2d");
    canvas.style.top = "0px";
    canvas.style.left = "0px";
    canvas.style.pointerEvents = "none";
    canvas.style.position = "fixed";
    canvas.style.zIndex = "2147483647";
    document.body.appendChild(canvas);
    canvas.width = width;
    canvas.height = height;
    window.addEventListener("resize", onResize);
    window.addEventListener("mousemove", onMouseMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });
    lastFrame = performance.now();
  }

  function onResize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }

  function onMouseMove(e) {
    const now = performance.now();
    const dt = Math.max(8, now - lastMove);
    cursorVX = (e.clientX - prev.x) / dt;      // px per ms — drives the streak
    cursorVY = (e.clientY - prev.y) / dt;
    prev.x = e.clientX;
    prev.y = e.clientY;
    cursor.x = e.clientX;
    cursor.y = e.clientY;
    lastMove = now;

    const speed = Math.hypot(cursorVX, cursorVY);
    const burst = Math.min(4, 1 + Math.floor(speed * 40));
    for (let i = 0; i < burst; i++) {
      particles.push(new Spark(
        cursor.x + (Math.random() - 0.5) * 6,
        cursor.y + (Math.random() - 0.5) * 6,
        cursorVX * (0.22 + Math.random() * 0.3),
        cursorVY * (0.22 + Math.random() * 0.3),
        now
      ));
    }
    if (particles.length > 90) particles.splice(0, particles.length - 90);
    wake();
  }

  function onTouchMove(e) {
    if (e.touches.length > 0) {
      onMouseMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
    }
  }

  function updateParticles(now, dtMs) {
    context.clearRect(0, 0, width, height);
    if (!particles.length) return;
    for (const p of particles) p.update(now, dtMs);
    particles = particles.filter((p) => !p.dead);
    for (const p of particles) p.draw(context);
  }

  let looping = false;
  function loop() {
    const now = performance.now();
    const dtMs = Math.min(48, now - lastFrame);
    lastFrame = now;
    updateParticles(now, dtMs);
    if (particles.length) requestAnimationFrame(loop);
    else looping = false;
  }
  function wake() {
    if (looping || !canvas) return;
    looping = true;
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }

  init();
}

/* -------------------------------------------------------------------- sync */
function render(data) {
  state.snapshot = data;
  state.clockOffset = Number(data.server_time || Date.now()) - Date.now();
  state.lastSync = Date.now();

  renderProfile(data);
  renderPresencePill(data);
  renderPresenceBox(data);
  renderNow(data);
  renderRecent(data);

  const age = data.generated_at ? (Date.now() + state.clockOffset - data.generated_at) / 1000 : 0;
  const sync = $("sync");
  if (sync) {
    if (age > 90) {
      sync.textContent = `stale ${Math.round(age)}s`;
      sync.className = "lost";
    } else {
      sync.textContent = data.discord?.ok ? "live" : "local";
      sync.className = "";
    }
  }
}

function lanyardToDiscord(d) {
  const u = d.discord_user || {};
  const acts = Array.isArray(d.activities) ? d.activities : [];
  const custom = acts.find((a) => a.type === 4);
  const sp = d.spotify;
  return {
    ok: true,
    status: d.discord_status || "offline",
    user: {
      id: u.id,
      username: u.username || "ps1coseadoo",
      avatar: u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256` : null,
      avatarDecoration: (u.avatar_decoration_data && u.avatar_decoration_data.asset) || null,
    },
    custom_status: custom ? { text: custom.state || "", emoji: (custom.emoji && custom.emoji.name) || null } : null,
    activities: acts.filter((a) => a.type !== 4 && a.type !== 2).map((a) => ({ kind: "game", name: a.name, details: a.details || a.state || "" })),
    spotify: sp ? { track: sp.song, artist: sp.artist, album: sp.album } : null,
  };
}

async function poll() {
  try {
    const id = window.__CONFIG__ && window.__CONFIG__.discord_id;
    let discord = state.lastDiscord || window.__STATE__.discord;
    state.polls = (state.polls || 0) + 1;
    if (id && ((state.lanyardFails || 0) < 3 || state.polls % 12 === 0)) {
      try {
        const r = await fetch(`https://api.lanyard.rest/v1/users/${id}`, { cache: "no-store" });
        const j = await r.json();
        if (j && j.success) { discord = state.lastDiscord = lanyardToDiscord(j.data); state.lanyardFails = 0; }
        else state.lanyardFails = (state.lanyardFails || 0) + 1;
      } catch (e) { state.lanyardFails = (state.lanyardFails || 0) + 1; }
    }
    render({ ...window.__STATE__, discord, server_time: Date.now(), generated_at: Date.now() });
  } catch (err) {
    const sync = $("sync");
    if (sync) { sync.textContent = "offline"; sync.className = "lost"; }
    console.warn("[profile] poll failed:", err);
  }
}

async function loadConfig() {
  try {
    const cfg = window.__CONFIG__ || {};

    if (cfg.profile) { renderBio(cfg.profile); if (state.snapshot) renderPresencePill(state.snapshot); }
    renderStaff(cfg.portfolio || cfg.participation);

    const intro = cfg.intro || {};
    if (Array.isArray(intro.taglines)) startTypewriter(intro.taglines);
    if (typeof intro.volume === "number" && intro.volume >= 0 && intro.volume <= 1) {
      state.musicVolume = intro.volume;
      const slider = $("volume-slider");
      if (slider) slider.value = String(intro.volume);
    }
    if (intro.music === false) {
      const audio = $("bg-music");
      if (audio) audio.remove();
    }
    $("song-credit").textContent = intro.credit || "";

    initIntroStage(intro.displayText || "PSICOSEADO");
  } catch (err) {
    console.warn("[profile] config fetch failed:", err);
    initIntroStage("PSICOSEADO");
    startTypewriter(["Searching for new Projects", "Learning to PC Check"]);
  }
}

/* ---------------------------------------------------------------- extra fx */
// Full motion is forced on this portfolio; the OS reduce-motion setting is intentionally ignored.
const REDUCED = false;

/* mouse parallax for the monochrome background + click shockwave */
function initFx() {
  if (REDUCED) return;
  const root = document.documentElement;
  let px = 0;
  let py = 0;
  let queued = false;

  window.addEventListener("pointermove", (ev) => {
    px = ev.clientX / window.innerWidth - 0.5;
    py = ev.clientY / window.innerHeight - 0.5;
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      state.px = px;
      state.py = py;
    });
  }, { passive: true });

  window.addEventListener("pointerdown", (ev) => {
    if (!state.revealed) return;
    const ring = document.createElement("span");
    ring.className = "fx-shock";
    ring.style.left = `${ev.clientX}px`;
    ring.style.top = `${ev.clientY}px`;
    document.body.appendChild(ring);
    ring.addEventListener("animationend", () => ring.remove(), { once: true });
  }, { passive: true });
}

/* staff cards below the fold fade/slide in as they scroll into view */
function observeReveals() {
  return; // disabled: could leave cards hidden on some phones
  if (REDUCED || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const el = en.target;
      io.unobserve(el);
      const d = Number(el.dataset.rvi || 0) * 70;
      el.style.transitionDelay = `${d}ms`;
      el.classList.add("rv-in");
      setTimeout(() => {
        el.classList.remove("rv", "rv-in");
        el.style.transitionDelay = "";
      }, 800 + d);
    }
  }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });

  document.querySelectorAll("#staffCategories .server-card").forEach((el, n) => {
    if (el.classList.contains("rv")) return;
    if (el.getBoundingClientRect().top < window.innerHeight * 0.95) return;
    el.dataset.rvi = String(n % 3);
    el.classList.add("rv");
    io.observe(el);
  });
}


/* ---------------------------------------------------------------- 3D tilt */
/* one delegated listener, one element animated at a time, vars written once per frame */
function initTilt() {
  if (REDUCED || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const SEL = ".server-card, .stat-card, .profile-wrapper, .bio-links-grid .bio-link";
  let cur = null, rect = null, qx = 0, qy = 0, queued = false, max = 9;

  const apply = () => {
    queued = false;
    if (!cur || !rect) return;
    const nx = Math.max(-1, Math.min(1, ((qx - rect.left) / rect.width) * 2 - 1));
    const ny = Math.max(-1, Math.min(1, ((qy - rect.top) / rect.height) * 2 - 1));
    const st = cur.style;
    st.setProperty("--ry", (nx * max).toFixed(2) + "deg");
    st.setProperty("--rx", (-ny * max).toFixed(2) + "deg");
    st.setProperty("--gx", (((nx + 1) / 2) * 100).toFixed(1) + "%");
    st.setProperty("--gy", (((ny + 1) / 2) * 100).toFixed(1) + "%");
    st.setProperty("--lx", (-nx).toFixed(3));
    st.setProperty("--ly", (-ny).toFixed(3));
  };

  const leave = () => {
    if (!cur) return;
    cur.classList.remove("tilting");
    for (const p of ["--rx", "--ry", "--gx", "--gy", "--lx", "--ly"]) cur.style.removeProperty(p);
    cur = null;
    rect = null;
  };

  window.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || !state.revealed || document.body.classList.contains("lite")) return;
    const t = e.target.closest ? e.target.closest(SEL) : null;
    if (t !== cur) {
      leave();
      if (t) {
        cur = t;
        rect = t.getBoundingClientRect();
        max = t.classList.contains("profile-wrapper") ? 15 : t.classList.contains("stat-card") ? 11 : t.classList.contains("bio-link") ? 12 : 9;
        t.classList.add("tilting");
      }
    }
    if (!cur) return;
    qx = e.clientX;
    qy = e.clientY;
    if (!queued) { queued = true; requestAnimationFrame(apply); }
  }, { passive: true });
  window.addEventListener("scroll", leave, { passive: true });
  document.documentElement.addEventListener("mouseleave", leave);
}

/* ------------------------------------------------------------- 3D logo ring */
function buildRing(entries) {
  const host = $("logoRing");
  if (!host) return;
  state.ringEntries = entries;
  if (REDUCED || !state.revealed) return;  // don't decode extra images while the intro is running
  const list = (entries || []).filter((e) => e && typeof e.image === "string" &&
    (/^data:image\/(webp|png|jpe?g);base64,/i.test(e.image) || e.image.startsWith("/") || safeUrl(e.image)));
  if (list.length < 3) { host.style.display = "none"; return; }
  const sig = list.map((e) => e.name).join("|");
  if (host.dataset.sig === sig) return;   // poll re-renders every few seconds: only rebuild if the servers changed
  host.dataset.sig = sig;
  if (!Element.prototype.animate) { host.style.display = "none"; return; }
  const n = list.length;
  const step = 360 / n;
  host.innerHTML = `<div class="rs"><div class="rs-spin">${list.map((e, i) =>
    `<div class="rf" style="--k:${i};--s:${step.toFixed(3)}deg"><img src="${esc(e.image)}" alt="${esc(e.name)}" decoding="async" draggable="false"></div>`
  ).join("")}</div></div>`;

  // One shared clock: the ring spins, every logo counter-rotates by exactly the same amount so it always faces the camera.
  const T = 28000;
  const anims = [host.querySelector(".rs-spin").animate(
    [{ transform: "rotateY(0deg)" }, { transform: "rotateY(360deg)" }], { duration: T, iterations: Infinity })];
  host.querySelectorAll(".rf").forEach((rf, i) => {
    const a = i * step;
    anims.push(rf.firstElementChild.animate(
      [{ transform: `rotateY(${-a}deg) rotateX(14deg)` }, { transform: `rotateY(${-a - 360}deg) rotateX(14deg)` }],
      { duration: T, iterations: Infinity }));
  });
  const t0 = document.timeline.currentTime;
  anims.forEach((a) => { a.startTime = t0; });
  const ring = state.ring = { anims, inView: true, hover: false };
  ring.sync = () => anims.forEach((a) => (ring.inView && !ring.hover && !document.hidden ? a.play() : a.pause()));
  if (!host.dataset.io) {
    host.dataset.io = "1";
    host.addEventListener("pointerenter", () => { if (state.ring) { state.ring.hover = true; state.ring.sync(); } });
    host.addEventListener("pointerleave", () => { if (state.ring) { state.ring.hover = false; state.ring.sync(); } });
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((en) => { if (state.ring) { state.ring.inView = en[0].isIntersecting; state.ring.sync(); } }).observe(host);
    }
  }
}

function tickClock() {

}

/* ============================================================ custom cursor */
function initCursorFx() {
  if (window.matchMedia("(pointer: coarse)").matches) return;

  const layer = document.createElement("div");
  layer.id = "cursor-layer";
  layer.innerHTML = `
    <div class="cursor-arrow">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="cursor-metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".5" stop-color="#dedede"/>
          <stop offset="1" stop-color="#8f8f8f"/>
        </linearGradient>
      </defs>
      <path d="M4 2 L4 20 L9.5 15.2 L12.6 22 L16 20.5 L12.9 13.9 L20 13.2 Z" fill="url(#cursor-metal)" stroke="#050505" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M5.8 5.2 L5.8 14.8 L8.6 12.2" fill="none" stroke="rgba(255,255,255,.65)" stroke-width=".7" stroke-linecap="round"/>
    </svg>
    </div>
    <div class="cursor-ibeam"></div>`;
  document.body.appendChild(layer);

  const fx = document.createElement("canvas");
  fx.id = "cursor-canvas";
  document.body.appendChild(fx);
  const fctx = fx.getContext("2d");
  let cw = 0;
  let ch = 0;
  const resize = () => {
    cw = fx.width = window.innerWidth;
    ch = fx.height = window.innerHeight;
  };
  resize();
  window.addEventListener("resize", resize, { passive: true });

  const parts = [];
  const MAX_PARTS = 26;
  let x = window.innerWidth / 2;
  let y = window.innerHeight / 2;
  let lx = x;
  let ly = y;
  let lt = performance.now();
  let lastSpawn = 0;
  let lastFrame = performance.now();

  const isOn = () => document.documentElement.classList.contains("custom-cursor");
  const show = (on) => { layer.style.opacity = on ? "1" : "0"; };
  const place = (px, py) => {
    x = px;
    y = py;
    layer.style.setProperty("--cx", px.toFixed(1) + "px");
    layer.style.setProperty("--cy", py.toFixed(1) + "px");
  };

  // Leave only a few tiny, short-lived specks behind the pointer.
  const spawn = (now, vx, vy, amount) => {
    for (let i = 0; i < amount; i++) {
      parts.push({
        x: x + (Math.random() - 0.5) * 3,
        y: y + (Math.random() - 0.5) * 3,
        vx: vx * -0.018 + (Math.random() - 0.5) * 0.008,
        vy: vy * -0.018 + (Math.random() - 0.5) * 0.008,
        born: now,
        life: 260 + Math.random() * 220,
        size: 0.8 + Math.random() * 1.3,
      });
    }
    if (parts.length > MAX_PARTS) parts.splice(0, parts.length - MAX_PARTS);
  };

  const frame = (now) => {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const dt = Math.min(48, now - lastFrame);
    lastFrame = now;

    if (!parts.length) {
      if (cw && ch) fctx.clearRect(0, 0, cw, ch);
      return;
    }
    fctx.clearRect(0, 0, cw, ch);
    fctx.save();
    fctx.globalCompositeOperation = "lighter";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      const k = (now - p.born) / p.life;
      if (k >= 1) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.975;
      p.vy *= 0.975;
      const fade = (1 - k) * (1 - k);
      const s = p.size * (1 - k * 0.5);
      fctx.fillStyle = `rgba(255,255,255,${(fade * 0.12).toFixed(3)})`;
      fctx.beginPath();
      fctx.arc(p.x, p.y, s * 2.3, 0, 6.2832);
      fctx.fill();
      fctx.fillStyle = `rgba(255,255,255,${(fade * 0.34).toFixed(3)})`;
      fctx.beginPath();
      fctx.arc(p.x, p.y, s, 0, 6.2832);
      fctx.fill();
    }
    fctx.restore();
  };
  requestAnimationFrame(frame);

  window.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || !isOn()) return;
    const now = performance.now();
    const dt = Math.max(8, now - lt);
    const vx = (e.clientX - lx) / dt;
    const vy = (e.clientY - ly) / dt;
    place(e.clientX, e.clientY);
    lx = x;
    ly = y;
    lt = now;
    show(true);
    if (now - lastSpawn > 24) {
      lastSpawn = now;
      spawn(now, vx, vy, Math.hypot(vx, vy) > 1.15 ? 2 : 1);
    }
  }, { passive: true });

  window.addEventListener("pointerdown", () => {
    if (!isOn()) return;
    document.body.classList.add("cursor-down");
    spawn(performance.now(), 0, 0, 5);
  }, { passive: true });

  window.addEventListener("pointerup", () => {
    document.body.classList.remove("cursor-down");
  }, { passive: true });

  document.documentElement.addEventListener("mouseleave", () => show(false));
  document.documentElement.addEventListener("mouseenter", () => { if (isOn()) show(true); });
  window.addEventListener("blur", () => show(false));

  const HOT = "a,button,input,textarea,select,label,.server-card,.stat-card,.bio-link,.panel-item,.profile-wrapper,.profile-image,#volume-control,#bg-start-audio";
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest ? e.target.closest(HOT) : null;
    document.body.classList.toggle("cursor-hot", !!t);
    const text = !!(t && t.closest('input,textarea,[contenteditable="true"]'));
    document.body.classList.toggle("cursor-text", text);
  }, { passive: true });
}

/* ====================================================== aurora paint helper */
function paintAuroraBand(c, bw, bh, t, base, amp, freq, speed, phase, rgb, alpha, thick) {
  const N = 72;
  for (let layer = 0; layer < 3; layer++) {
    const half = layer === 0 ? 1 : layer === 1 ? 0.55 : 0.2;
    const a = layer === 0 ? alpha * 0.2 : layer === 1 ? alpha * 0.5 : alpha;
    c.fillStyle = `rgba(${rgb},${a.toFixed(3)})`;
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const x = u * bw;
      const y = bh * base
        + Math.sin(u * freq * 6.283 + t * speed + phase) * bh * amp
        + Math.sin(u * freq * 14.1 - t * speed * 0.63 + phase * 1.7) * bh * amp * 0.38;
      const hh = bh * thick * (0.7 + 0.3 * Math.sin(u * freq * 9.2 + t * 0.53 + phase)) * half;
      if (i === 0) c.moveTo(x, y - hh);
      else c.lineTo(x, y - hh);
    }
    for (let i = N; i >= 0; i--) {
      const u = i / N;
      const x = u * bw;
      const y = bh * base
        + Math.sin(u * freq * 6.283 + t * speed + phase) * bh * amp
        + Math.sin(u * freq * 14.1 - t * speed * 0.63 + phase * 1.7) * bh * amp * 0.38;
      const hh = bh * thick * (0.7 + 0.3 * Math.sin(u * freq * 9.2 + t * 0.53 + phase)) * half;
      c.lineTo(x, y + hh);
    }
    c.closePath();
    c.fill();
  }
}

function paintAuroraCurtain(c, bw, bh, t, base, amp, freq, speed, phase, rgb, alpha, thick) {
  const N = 72;
  for (let layer = 0; layer < 3; layer++) {
    const half = layer === 0 ? 1 : layer === 1 ? 0.55 : 0.2;
    const a = layer === 0 ? alpha * 0.2 : layer === 1 ? alpha * 0.5 : alpha;
    c.fillStyle = `rgba(${rgb},${a.toFixed(3)})`;
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const y = u * bh;
      const x = bw * base
        + Math.sin(u * freq * 6.283 + t * speed + phase) * bw * amp
        + Math.sin(u * freq * 13.4 - t * speed * 0.57 + phase * 2.1) * bw * amp * 0.4;
      const ww = bw * thick * (0.7 + 0.3 * Math.sin(u * freq * 8.4 + t * 0.44 + phase)) * half;
      if (i === 0) c.moveTo(x - ww, y);
      else c.lineTo(x - ww, y);
    }
    for (let i = N; i >= 0; i--) {
      const u = i / N;
      const y = u * bh;
      const x = bw * base
        + Math.sin(u * freq * 6.283 + t * speed + phase) * bw * amp
        + Math.sin(u * freq * 13.4 - t * speed * 0.57 + phase * 2.1) * bw * amp * 0.4;
      const ww = bw * thick * (0.7 + 0.3 * Math.sin(u * freq * 8.4 + t * 0.44 + phase)) * half;
      c.lineTo(x + ww, y);
    }
    c.closePath();
    c.fill();
  }
}

/* ==================================================== intro animated bg */
/* ---------------------------------------------------------- intro backdrop */
function initIntroFx() {
  const canvas = $("intro-bg-canvas");
  const overlay = $("bg-start-audio");
  if (!canvas || !overlay) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  let w = 0;
  let h = 0;
  let dpr = 1;
  let last = 0;
  let raf = 0;
  let px = 0;
  let py = 0;
  let cx = 0;
  let cy = 0;

  const motes = Array.from({ length: 96 }, () => ({
    x: Math.random(),
    y: Math.random(),
    z: 0.12 + Math.random() * 0.88,
    r: 0.35 + Math.random() * 1.15,
    p: Math.random() * Math.PI * 2,
    s: 0.24 + Math.random() * 0.85,
    v: 0.0014 + Math.random() * 0.0042,
  }));

  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize, { passive: true });
  overlay.addEventListener("pointermove", (e) => {
    px = (e.clientX / window.innerWidth) * 2 - 1;
    py = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });
  overlay.addEventListener("pointerleave", () => { px = 0; py = 0; });

  const frame = (now) => {
    if (!canvas.isConnected) return;
    raf = requestAnimationFrame(frame);
    if (!last) last = now;
    const elapsed = now - last;
    if (elapsed < 26) return;
    const dt = Math.min(64, elapsed);
    last = now;
    const t = now / 1000;
    const leaving = overlay.classList.contains("is-leaving");

    cx += (px - cx) * 0.05;
    cy += (py - cy) * 0.05;

    ctx.clearRect(0, 0, w, h);

    // slow diagonal light travelling across the stage
    const cycle = (t % 22) / 22;
    const bx = -0.4 * w + cycle * 1.8 * w;
    const sweep = ctx.createLinearGradient(bx - 210, 0, bx + 210, h);
    sweep.addColorStop(0, "rgba(255,255,255,0)");
    sweep.addColorStop(0.5, "rgba(255,255,255,0.026)");
    sweep.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sweep;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = "lighter";
    for (const m of motes) {
      const speed = leaving ? 7 : 1;
      m.y -= m.v * dt * (0.28 + m.z) * speed;
      if (m.y < -0.05) {
        m.y = 1.05;
        m.x = Math.random();
      }

      const depth = 0.35 + m.z;
      const ox = cx * 38 * m.z + Math.sin(t * m.s + m.p) * 7 * m.z;
      const oy = cy * 24 * m.z;
      const mx = m.x * w + ox;
      const my = m.y * h + oy;
      const twinkle = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t * m.s + m.p)), 2);
      const alpha = (0.075 + m.z * 0.3) * twinkle;
      const radius = m.r * depth;

      ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, 6.2832);
      ctx.fill();

      if (m.z > 0.78) {
        ctx.fillStyle = "rgba(255,255,255," + (alpha * 0.18).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(mx, my, radius * 4.5, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  };

  raf = requestAnimationFrame(frame);
}

/* ==================================================== main animated bg */
function initBgFx() {
  const canvas = $("bg-fx-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const lo = document.createElement("canvas");
  const lctx = lo.getContext("2d");
  let w = 0;
  let h = 0;
  let rafId = 0;
  let t0 = performance.now();
  let lite = false;
  let fpsAcc = 0;
  let fpsN = 0;
  let heat = 0;

  const embers = Array.from({ length: 26 }, () => ({
    x: Math.random(),
    y: Math.random() * 1.1,
    vy: 0.00004 + Math.random() * 0.00007,
    sway: 0.004 + Math.random() * 0.01,
    ph: Math.random() * Math.PI * 2,
    ps: 0.6 + Math.random() * 1.2,
    r: 0.7 + Math.random() * 1.9,
  }));

  const motes = Array.from({ length: 34 }, () => ({
    x: Math.random(),
    y: Math.random(),
    z: 0.35 + Math.random() * 0.65,
    r: 0.5 + Math.random() * 1.1,
    p: Math.random() * Math.PI * 2,
    s: 0.4 + Math.random() * 0.9,
  }));

  const resize = () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  };
  resize();
  window.addEventListener("resize", resize, { passive: true });

  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(rafId);
    if (!document.hidden) {
      t0 = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  });

  const frame = (now) => {
    rafId = requestAnimationFrame(frame);
    if (!state.revealed) return;
    if (now - t0 < 28) return;
    const dtMs = Math.min(64, now - t0);
    const dt = dtMs / 1000;
    t0 = now;
    const t = now / 1000;

    if (!lite && fpsN < 180) {
      fpsN++;
      if (fpsN > 90) fpsAcc += dtMs;
      if (fpsN === 180 && fpsAcc / 90 > 52) {
        lite = true;
        document.body.classList.add("lite");
      }
    }

    heat += ((document.body.dataset.part === "two" ? 1 : 0) - heat) * Math.min(1, dt * 1.3);

    const lw = Math.max(120, Math.round(w / 8));
    const lh = Math.max(80, Math.round(h / 8));
    if (lo.width !== lw || lo.height !== lh) {
      lo.width = lw;
      lo.height = lh;
    }
    lctx.clearRect(0, 0, lw, lh);
    lctx.globalCompositeOperation = "lighter";
    paintAuroraBand(lctx, lw, lh, t, 0.12, 0.035, 0.50, 0.08, 1.1, "200,200,200", 0.12, 0.045);
    paintAuroraBand(lctx, lw, lh, t, 0.52, 0.050, 0.32, -0.10, 2.4, "90,90,90", 0.13, 0.060);
    paintAuroraBand(lctx, lw, lh, t, 0.88, 0.030, 0.45, 0.12, 4.0, "255,255,255", 0.07 + 0.08 * heat, 0.040);
    lctx.globalCompositeOperation = "source-over";

    ctx.clearRect(0, 0, w, h);
    const px = (state.px || 0) * -16;
    const py = (state.py || 0) * -10;
    ctx.drawImage(lo, px - 14, py - 10, w + 28, h + 20);

    const camX = (state.px || 0) * -70;
    const camY = (state.py || 0) * -46;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const m of motes) {
      const a = 0.08 + 0.30 * Math.pow(Math.max(0, Math.sin(t * m.s + m.p)), 2);
      const mx = m.x * w + m.z * camX;
      const my = m.y * h + m.z * camY;
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(mx, my, m.r, 0, 6.2832);
      ctx.fill();
    }

    if (!lite) for (const e of embers) {
      e.y -= e.vy * dtMs;
      e.ph += e.ps * dt;
      e.x += Math.sin(e.ph) * e.sway * dt;
      if (e.y < -0.05) {
        e.y = 1.05;
        e.x = Math.random();
      }
      const a = (0.14 + 0.42 * Math.min(1, Math.max(0, e.y))) * (0.6 + 0.4 * Math.sin(e.ph * 2.3));
      const ex = e.x * w;
      const ey = e.y * h;
      ctx.fillStyle = `rgba(255,255,255,${(a * 0.2).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(ex, ey, e.r * 3.2, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(ex, ey, e.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();

    if (!lite) {
      const scan = ((now / 1000) % 13) / 13;
      const sy = scan * (h + 220) - 110;
      const sg = ctx.createLinearGradient(0, sy - 90, 0, sy + 90);
      sg.addColorStop(0, "rgba(255,255,255,0)");
      sg.addColorStop(0.5, "rgba(255,255,255,0.035)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, sy - 90, w, 180);
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(0, sy, w, 1);
    }
  };
  rafId = requestAnimationFrame(frame);
}

function boot() {
  tickClock();
  setInterval(() => { if (!document.hidden) tickClock(); }, 1000);
  setInterval(() => { if (!document.hidden) paintProgress(); }, 500);

  initIntroFx();
  initBgFx();
  initFx();
  bindIntro();
  bindPanel();
  bindVolume();
  if (!window.matchMedia("(pointer: coarse)").matches) {
    initCursorFx();
    document.documentElement.classList.add("custom-cursor");
  }
  loadConfig();
  poll();
  syncDiscordProfile(true);
  setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
  setInterval(() => { if (!document.hidden) syncDiscordProfile(); }, DISCORD_PROFILE_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tickClock(); poll(); syncDiscordProfile(); } });
  initTilt();

  document.addEventListener("keydown", (ev) => {
    if (ev.key.toLowerCase() === "r" && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
      poll();
      syncDiscordProfile(true);
    }
  });
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
